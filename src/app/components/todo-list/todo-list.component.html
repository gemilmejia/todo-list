<div class="filters">
  <button (click)="filter = 'all'" [class.active]="filter === 'all'">
    All
  </button>

  <button (click)="filter = 'active'" [class.active]="filter === 'active'">
    Active
  </button>

  <button
    (click)="filter = 'completed'"
    [class.active]="filter === 'completed'"
  >
    Completed
  </button>
</div>

<ul>
  @for (todo of filteredTodos; track $index) {
    <app-todo-item
      [todo]="todo"
      (deleteClicked)="deleteTodo($event)"
      (completeClicked)="completeTodo($event)"
      (editSaved)="updateTodo($event)"
    >
    </app-todo-item>
  }
</ul>
