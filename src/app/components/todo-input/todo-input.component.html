<!-- Check your HTML -->
<div class="todo-input">
  <input
    type="text"
    [(ngModel)]="task"
    maxlength="100"
    placeholder="Enter your task..."
    (input)="clearError()"
  />

  <button (click)="addTask()" [disabled]="task.trim() === ''">Add task</button>
</div>

<!-- [class.CLASS_NAME]="CONDITION" -->
<div
  class="character-count"
  [class.warning]="task.length >= 80"
  [class.limit]="task.length === 100"
>
  {{ task.length }}/100
</div>

@if (errorMessage) {
  <div class="error-message">⚠️ {{ errorMessage }}</div>
}
