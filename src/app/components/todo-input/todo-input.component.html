<!-- Check your HTML -->
<div class="todo-input">
  <input
    type="text"
    [(ngModel)]="task"
    maxlength="100"
    placeholder="Enter your task..."
    (input)="clearError()"
  />

  <button (click)="addTask()" [disabled]="task.trim() === ''">Add task</button>
</div>

@if (errorMessage) {
  <div class="error-message">⚠️ {{ errorMessage }}</div>
}
