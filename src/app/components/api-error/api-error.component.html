<div class="api-error" role="alert" aria-labelledby="api-error-title">
  <strong id="api-error-title">{{ title() }}</strong>

  <span class="api-error-type">
    {{ getTypeLabel() }}
  </span>

  <p>{{ message() ?? error().message }}</p>

  <button
    type="button"
    class="api-retry"
    [attr.aria-label]="isLoading() ? loadingMessage() : actionLabel()"
    [disabled]="isLoading()"
    (click)="onRetry()"
  >
    {{ isLoading() ? loadingMessage() : actionLabel() }}
  </button>
</div>
