@if (isEditing) {
  <div class="edit-form">
    <input
      type="text"
      [(ngModel)]="editTitle"
      (ngModelChange)="editError = ''"
    />

    @if (editError) {
      <small class="edit-error"> ⚠️ {{ editError }} </small>
    }

    <div class="edit-actions">
      <button (click)="saveEditing()">Save</button>
      <button (click)="cancelEditing()">Cancel</button>
    </div>
  </div>
}

<li [class.completed]="todo.completed">
  {{ todo.completed ? "✅" : "⬜" }}

  <div class="todo-content">
    <span class="todo-title">{{ todo.title }}</span>

    @if (todo.completed && todo.completedAt) {
      <small class="completed-date">
        Completed: {{ todo.completedAt | date: "mediumDate" }}
      </small>

      <small class="completion-relative-time">
        🕐 {{ getCompletedTimeText() }}
      </small>
    }
  </div>

  <button (click)="startEditing()">Edit</button>

  <button (click)="completeTodo()">
    {{ todo.completed ? "Undo" : "Complete" }}
    <!-- Condition ? valueIfTrue : valueIfFalse -->
  </button>

  <button (click)="deleteTodo()">Delete</button>
</li>
