@if (isEditing) {
  <div class="edit-form">
    <input
      #editInput
      type="text"
      [(ngModel)]="editTitle"
      maxlength="100"
      aria-label="Edit task title"
      (ngModelChange)="editError = ''"
      (keydown.enter)="saveEditing()"
      (keydown.escape)="cancelEditing()"
    />

    <small class="edit-character-count" aria-live="polite" [class.warning]="editTitle.length >= 80 && editTitle.length < 100" [class.limit]="editTitle.length >= 100">
      {{ editTitle.length }}/100
    </small>

    <!-- Display error message if editError is not empty -->
    @if (editError) {
      <small class="edit-error" role="alert"> ⚠️ {{ editError }} </small>
    }

    <div class="edit-actions">
      <button (click)="saveEditing()" [disabled]="editTitle.trim() === ''">
        Save
      </button>
      <button (click)="cancelEditing()">Cancel</button>
    </div>
  </div>
}

<li [class.completed]="todo.completed">
  {{ todo.completed ? "✅" : "⬜" }}

  <div class="todo-content">
    <span class="todo-title">{{ todo.title }}</span>

    @if (todo.completed && todo.completedAt) {
      <small class="completed-date">
        Completed: {{ todo.completedAt | date: "mediumDate" }}
      </small>

      <small class="completion-relative-time">
        🕐 {{ getCompletedTimeText() }}
      </small>
    }
  </div>

  <button (click)="startEditing()">Edit</button>

  <button (click)="completeTodo()">
    {{ todo.completed ? "Undo" : "Complete" }}
    <!-- Condition ? valueIfTrue : valueIfFalse -->
  </button>

  <button (click)="deleteTodo()">Delete</button>
</li>
