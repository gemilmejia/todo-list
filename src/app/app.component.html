<div class="container">
  <h1>My Todo List</h1>

  <!-- <input type="text" placeholder="Enter your task..." [(ngModel)]="task" />
  
  <button (click)="addTask()">Add task</button> -->

  <app-todo-input
    (taskAdded)="onTaskAdded($event)">
    <!-- Listen for the taskAdded event and call the onTaskAdded method with the emitted value -->
  </app-todo-input>

  <ul>
    @for (todo of todos; track $index) {
      <li>
        <!-- Display the todo title -->
        {{ todo.completed ? "✅" : "⬜" }} {{ todo.title }}

        <button (click)="toggleCompleted(todo)">Complete</button>

        <!-- Delete button to remove the task from the list -->
        <button (click)="deleteTodo(todo.id)">Delete</button>
      </li>
    }
  </ul>

  <!-- <p>{{ task }}</p> -->
</div>
